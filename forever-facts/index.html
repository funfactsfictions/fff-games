<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forever Facts Daily</title>
<meta name="description" content="One tavern puzzle a day: five rounds, one surprising fact each. From the Forever Facts channel.">
<meta property="og:title" content="Forever Facts Daily">
<meta property="og:description" content="Five rounds. Five weird facts. Can you keep your streak?">

<style>
/* VOICE occasion: a playful nightly ritual for gamers, loud host banter, quick to read
   IDEA a quest card pinned on the tavern board at the edge of the world, flipped over to reveal the fact
   PICTURE the tavern by moonlight with Nightella and Orkish at their table; the quest card is the game
   COLOUR one fixed night palette: wine-plum wood, parchment-white cards, moon cyan accent, orc green right, ember red wrong
   TYPE Cinzel for titles and numbers, Nunito for everything read
   LAYOUT laptop: scene and stats left, card right; phone: slim scene band with title, then the card filling the screen */
:root{color-scheme:dark;--bg:#24101f;--wood:#3a1830;--wood2:#4b2140;--ink:#fbefe1;--dim:#d9c3cf;--card:#fff7ec;--cink:#2a1424;--moon:#5fe3e8;--ok:#79c043;--bad:#ff5d5d;--gold:#ffd36b}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--moon);outline-offset:2px}
.app{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.side{position:relative;display:flex;flex-direction:column}
.scene{position:relative;height:clamp(150px,27svh,230px);overflow:hidden;background:var(--wood)}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.scene::after{content:"";position:absolute;inset:0 0 auto;height:100px;background:linear-gradient(#1a0816e6,#1a081600)}
.brand{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:max(12px,env(safe-area-inset-top,0px));right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font:900 clamp(24px,6vw,40px)/1.05 Cinzel,Georgia,serif;margin:0;letter-spacing:-.01em;text-shadow:0 2px 0 #1a0816}
h1 small{display:block;font:800 14px/1.3 Nunito,sans-serif;color:var(--moon);letter-spacing:0;text-shadow:none;margin-top:4px}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{background:#1a0816cc;border:1px solid #ffffff22;border-radius:999px;padding:4px 10px;font-weight:800;font-size:14px;white-space:nowrap}
.pill b{color:var(--gold);font-family:Cinzel,serif}
.stats{display:none}
main{padding:16px max(16px,env(safe-area-inset-left,0px)) 24px;display:flex;flex-direction:column;align-items:center;gap:14px}
.runes{display:flex;gap:8px;justify-content:center}
.rune{width:34px;height:34px;border-radius:9px;border:2px solid #ffffff33;display:grid;place-items:center;font:900 15px Cinzel,serif;color:var(--dim)}
.rune.now{border-color:var(--moon);color:var(--ink);box-shadow:0 0 0 3px #5fe3e833}
.rune.ok{background:var(--ok);border-color:var(--ok);color:#16300a}
.rune.bad{background:var(--bad);border-color:var(--bad);color:#3a0808}
.rune.boss{border-style:dashed}
.card{width:min(100%,560px);background:var(--card);color:var(--cink);border-radius:18px;padding:22px 20px 20px;box-shadow:0 10px 0 #12060f,0 0 0 1px #00000010 inset;position:relative}
.card::before,.card::after{content:"";position:absolute;top:-7px;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe08a,#b8862b);box-shadow:0 2px 0 #00000055}
.card::before{left:22px}.card::after{right:22px}
.tag{display:inline-flex;gap:6px;align-items:center;font-weight:800;font-size:13px;padding:3px 10px;border-radius:999px;background:#2a142414;color:#6b3a5c}
.tag.boss{background:#ffd36b;color:#4a3000}
.q{font:700 clamp(21px,5.2vw,27px)/1.25 Cinzel,Georgia,serif;margin:12px 0 18px;text-wrap:balance}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{min-height:54px;border-radius:12px;border:2px solid #2a142426;background:#fff;color:var(--cink);font-weight:800;font-size:17px;padding:10px 14px;text-align:left;transition:transform .12s,border-color .12s,background .12s}
.opts.two .opt{text-align:center}
.opt:hover:not(:disabled){border-color:#6b3a5c;transform:translateY(-2px)}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok);border-color:#4d8a22;color:#10280a}
.opt.wrong{background:var(--bad);border-color:#b63030;color:#fff}
.opt.dim{opacity:.45}
.reveal{margin-top:16px;border-top:2px dashed #2a142426;padding-top:14px;display:none}
.reveal.on{display:block;animation:pop .35s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.verdict{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;font:900 20px Cinzel,serif}
.verdict .xp{font:800 15px Nunito,sans-serif;color:#4d8a22;white-space:nowrap}
.fact{margin:8px 0 10px;font-size:17px}
.quip{display:flex;gap:10px;align-items:center;background:#2a14240d;border-radius:12px;padding:8px 12px;font-size:15px;font-weight:700;color:#5a3050}
.face{flex:none;width:36px;height:36px}
.btn{min-height:50px;border:0;border-radius:12px;background:var(--cink);color:var(--card);font-weight:800;font-size:17px;padding:12px 18px;width:100%;margin-top:14px}
.btn.alt{background:transparent;color:var(--cink);border:2px solid var(--cink)}
.btn.moon{background:var(--moon);color:#062a2c}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.row .btn{margin-top:10px}
.score{text-align:center}
.big{font:900 clamp(54px,16vw,80px)/1 Cinzel,serif;margin:6px 0}
.grid5{font-size:26px;letter-spacing:4px;margin:4px 0 8px}
.lvl{height:12px;background:#2a142418;border-radius:99px;overflow:hidden;margin:6px 0 4px}
.lvl i{display:block;height:100%;background:linear-gradient(90deg,var(--moon),var(--ok));border-radius:99px}
.small{font-size:14px;color:#6b4a60}
.toast{min-height:20px;font-weight:800;font-size:14px;color:#4d8a22;margin-top:6px}
.cta{width:min(100%,560px);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;color:var(--dim);font-size:15px}
.cta a{color:var(--moon);font-weight:800}
.welcome{width:min(100%,560px);background:#5fe3e81f;border:1px solid #5fe3e855;border-radius:12px;padding:8px 12px;font-weight:700;font-size:15px;display:none}
.welcome.on{display:block}
footer{color:#b89aac;font-size:13px;text-align:center;padding-top:4px}
footer a{color:#d9c3cf}
@media(min-width:900px){
.app{grid-template-columns:minmax(0,5fr) minmax(0,6fr);height:100%}
.side{height:100%;overflow:hidden}
.scene{height:100%;flex:1}
.brand{top:28px;left:32px;right:32px}
h1{font-size:46px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;position:absolute;left:32px;right:32px;bottom:28px}
.stat{background:#1a0816d9;border:1px solid #ffffff1f;border-radius:14px;padding:10px 14px}
.stat b{display:block;font:900 28px Cinzel,serif;color:var(--gold)}
.stat span{font-size:14px;color:var(--dim)}
.pills{display:none}
main{justify-content:center;overflow-y:auto;padding:32px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.flame{animation:none!important}}
.flame{transform-origin:center bottom;animation:flick 2.4s ease-in-out infinite alternate}
@keyframes flick{from{transform:scaleY(1)}to{transform:scaleY(1.12)}}
</style>
</head>

};
const FACES = {
 N:'<svg class="face" viewBox="-40 -50 80 80"><path d="M-20-18l-18-16 20 22z" fill="#b9a8ff"/><circle r="22" fill="#d9e2ff"/><path d="M-22-8c0-18 10-24 22-24s22 6 22 22c-10-10-24-10-44 2z" fill="#5fe3e8"/><circle cx="-7" cy="0" r="3" fill="#1aa6a0"/><circle cx="7" cy="0" r="3" fill="#1aa6a0"/></svg>',
 O:'<svg class="face" viewBox="-40 -50 80 80"><circle r="24" fill="#79c043"/><circle cx="-8" cy="-4" r="3.5" fill="#1a0816"/><circle cx="8" cy="-4" r="3.5" fill="#1a0816"/><path d="M-9 12l-2-9 6 8zM9 12l2-9-6 8z" fill="#fff7ec"/></svg>'
};
const store = {
 get(){try{return JSON.parse(localStorage.getItem("ffd")||"{}")}catch(e){return {}}},
 set(v){try{localStorage.setItem("ffd",JSON.stringify(v))}catch(e){}}
};
const EPOCH = Date.UTC(2026,10,24);
const now = new Date();
const dayNo = Math.floor((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())-EPOCH)/864e5)+1;
function rng(seed){let s=(seed%2147483646)+1;return()=>(s=s*16807%2147483647)/2147483647}
function shuffled(arr,seed){const r=rng(seed),a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pools = {};
for(const k of [T,G,W]) pools[k]=shuffled(BANK.filter(b=>b.c===k),777+k.length);
function daily(d){
 const plan=[W,G,T,W,d%2?T:G], used={};
 return plan.map((c,i)=>{const n=used[c]=(used[c]||0)+1;const p=pools[c];const per=plan.filter(x=>x===c).length;return {...p[((Math.abs(d)*per)+n-1)%p.length],boss:i===4}});
}
function extra(seed){const r=rng(seed);return shuffled(BANK,Math.floor(r()*1e6)).slice(0,5).map((q,i)=>({...q,boss:i===4}))}
let S = Object.assign({xp:0,streak:0,last:0,best:0,done:null}, store.get());
let game = null;
const $ = id=>document.getElementById(id);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const level = xp=>Math.floor(xp/500)+1;
function hud(){
 const lv=level(S.xp), streak=(S.last===dayNo||S.last===dayNo-1)?S.streak:0;
 $("pStreak").textContent=streak;$("sStreak").textContent=streak;
 $("pLvl").textContent=lv;$("sLvl").textContent=lv;$("sXp").textContent=S.xp.toLocaleString("en");
 $("dayLabel").textContent=(game&&game.mode==="extra")?"Extra quest":"Daily quest #"+dayNo;
}
function runes(){
 $("runes").innerHTML=game.qs.map((q,i)=>{const r=game.res[i];const cls=r===true?"ok":r===false?"bad":i===game.i?"now":"";return `<span class="rune ${cls} ${q.boss?"boss":""}" title="${q.boss?"Boss round":"Round "+(i+1)}">${q.boss?"B":i+1}</span>`}).join("");
}
function start(mode){trackLater(mode==="extra"?"ffd-bonus-start":"ffd-daily-start");
 const seed = mode==="extra" ? Date.now() : dayNo;
 game = {mode, qs: mode==="extra"?extra(seed):daily(dayNo), i:0, res:[], xp:0};
 hud();ask();
}
function ask(){
 const q=game.qs[game.i];runes();
 const opts = q.t==="tf"?["True","False"]:q.o;
 const two = opts.length===2;
 $("card").innerHTML=`<span class="tag ${q.boss?"boss":""}">${q.boss?"Boss round · double XP":CAT[q.c]} · ${game.i+1}/5</span>
 <h2 class="q">${esc(q.q)}</h2>
 <div class="opts ${two?"two":""}">${opts.map((o,i)=>`<button class="opt" id="opt${i}" data-i="${i}">${esc(o)}</button>`).join("")}</div>
 <div class="reveal" id="reveal"></div>`;
 $("card").querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.i)));
 if(game.i>0)$("opt0").focus({preventScroll:true});
}
function answer(i){
 const q=game.qs[game.i], ok=i===q.a;
 game.res[game.i]=ok;
 const gain = ok?(q.boss?200:100):10;
 game.xp+=gain;
 $("card").querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add("right");else if(k===i)b.classList.add("wrong");else b.classList.add("dim")});
 const pick=QUIPS[ok?"ok":"bad"][(dayNo+game.i)%4];
 const last=game.i===4;
 const r=$("reveal");
 r.innerHTML=`<div class="verdict"><span>${ok?"Correct!":"Not this time"}</span><span class="xp">+${gain} XP</span></div>
 <p class="fact">${esc(q.f)}</p>
 <div class="quip">${FACES[pick[0]]}<span>${pick[0]==="N"?"Nightella":"Orkish"}: ${esc(pick[1])}</span></div>
 <button class="btn" id="next">${last?"See my result":"Next round"}</button>`;
 r.classList.add("on");runes();
 $("next").addEventListener("click",()=>{if(last)finish();else{game.i++;ask()}});
 $("next").focus({preventScroll:true});
}
function finish(){
 const correct=game.res.filter(Boolean).length;
 if(game.mode==="daily"){
  S.streak = S.last===dayNo-1 ? S.streak+1 : (S.last===dayNo?S.streak:1);
  const bonus=Math.min(S.streak*10,100); game.xp+=bonus; game.bonus=bonus;
  S.last=dayNo; S.done={day:dayNo,res:game.res,xp:game.xp,bonus};
 }
 trackLater("ffd-finish-"+correct+"of5");S.xp+=game.xp; S.best=Math.max(S.best,correct); store.set(S);
 hud();results(game.res,game.xp,game.bonus||0,game.mode);
}
function shareText(res){
 return `Forever Facts Daily #${dayNo}\n${res.map(r=>r?"🟩":"🟥").join("")} ${res.filter(Boolean).length}/5 · streak ${S.streak}\n${SHARE_URL}`;
}
function results(res,xp,bonus,mode){
 game=game||{mode:"daily",qs:daily(dayNo),i:5,res};game.i=5;game.res=res;runes();
 const c=res.filter(Boolean).length, lv=level(S.xp), into=S.xp%500;
 const title=["The tavern is quiet tonight","A rough night","Getting warmer","Solid quest","Almost legendary","Legendary!"][c];
 $("card").innerHTML=`<div class="score">
 <span class="tag">${mode==="extra"?"Extra quest done":"Daily quest #"+dayNo+" done"}</span>
 <div class="big">${c}/5</div>
 <h2 class="q" style="margin:0 0 6px">${title}</h2>
 <div class="grid5" aria-label="${c} correct of 5">${res.map(r=>r?"🟩":"🟥").join("")}</div>
 <p class="small">+${xp} XP${bonus?` (incl. +${bonus} streak bonus)`:""} · ${S.streak}-day streak</p>
 <div class="lvl"><i style="width:${into/5}%"></i></div>
 <p class="small">Tavern level ${lv} · ${500-into} XP to level ${lv+1}</p>
 <p class="small" id="countdown"></p>
 <div class="row"><button class="btn moon" id="share">Share result</button><button class="btn alt" id="more">Extra quest</button></div>
 <div class="toast" id="toast"></div></div>`;
 $("share").addEventListener("click",share);
 $("more").addEventListener("click",()=>start("extra"));
 tick();
}
async function share(){trackLater("ffd-share");
 const text=shareText(S.done?S.done.res:game.res);
 try{ if(navigator.share){await navigator.share({text});return} }catch(e){ if(e&&e.name==="AbortError")return }
 try{await navigator.clipboard.writeText(text);$("toast").textContent="Copied! Paste it in the comments."}
 catch(e){$("toast").textContent="Copy failed. Select and copy: "+text.replace(/\n/g," ")}
}
function tick(){
 const el=$("countdown"); if(!el) return;
 const t=new Date(); const mid=new Date(t.getFullYear(),t.getMonth(),t.getDate()+1);
 const s=Math.max(0,Math.floor((mid-t)/1000));
 el.textContent=`Next daily quest in ${String(Math.floor(s/3600)).padStart(2,"0")}:${String(Math.floor(s%3600/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
}
setInterval(tick,1000);
const src={"from-yt":"YouTube","from-ig":"Instagram","from-fb":"Facebook","from-tt":"TikTok"}[location.hash.slice(1)];
if(src){trackLater("ffd-from-"+src.toLowerCase());$("welcome").textContent=`Welcome from ${src}! Five rounds, five weird facts. Comment your score under the video.`;$("welcome").classList.add("on")}
window.claude?.hot?.snapshot?.(()=>S);
if(S.done&&S.done.day===dayNo){game=null;hud();results(S.done.res,S.done.xp,S.done.bonus||0,"daily")}
else start("daily");
}
</script>
</body>
</html>
